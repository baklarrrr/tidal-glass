<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Set the volume and Bluetooth output for TIDAL on your iPhone.">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow">
  <title>Sound Lab</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>html, body { margin: 0; background: #000; }</style>
  <!-- The normal Sound Lab tile uses the iPhone. Ignore old Android install fragments. -->
  <script>
    const target = new URL('../?app=sound', location.href);
    const bridge = new URLSearchParams(location.hash.slice(1)).get('androidBridge');
    if (bridge) target.hash = new URLSearchParams({androidBridge: bridge}).toString();
    location.replace(target.href);
  </script>
</head>
<body></body>
</html>
